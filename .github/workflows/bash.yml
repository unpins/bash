name: Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    uses: unpins/action-build/.github/workflows/build.yml@v1
    with:
      package_name: 'bash'
      package_data: true
      # darwin-x86_64 is cross-built from the aarch64-darwin runner
      # (single-runner pattern, mirrors Windows-from-Linux). macos-13
      # dropped — Intel runner pool is scarce. Native-only, no Windows.
      platforms: |
        [
          {"runner":"ubuntu-latest",    "os":"linux",   "arch":"x86_64"},
          {"runner":"ubuntu-24.04-arm", "os":"linux",   "arch":"aarch64"},
          {"runner":"macos-14",         "os":"darwin",  "arch":"aarch64"},
          {"runner":"macos-14",         "os":"darwin",  "arch":"x86_64", "attr":"packages.aarch64-darwin.\"darwin-x86_64\""}
        ]
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
